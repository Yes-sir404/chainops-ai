services:
  postgres:
    image: postgres:17-alpine
    container_name: chainops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chainops}
      POSTGRES_USER: ${POSTGRES_USER:-chainops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chainops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chainops} -d ${POSTGRES_DB:-chainops}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chainops_pgdata:
